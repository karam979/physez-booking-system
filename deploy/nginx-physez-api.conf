# PhysEZ API — Nginx reverse proxy.
# Alternative to the Caddyfile in this folder; use one or the other.
#   sudo cp nginx-physez-api.conf /etc/nginx/sites-available/physez-api
#   sudo ln -s /etc/nginx/sites-available/physez-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d REPLACE-WITH-API-HOST
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE-WITH-API-HOST;

    # Everything else is redirected; certbot adds the ACME challenge location.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE-WITH-API-HOST;

    # certbot fills these in when you run the command above.
    ssl_certificate     /etc/letsencrypt/live/REPLACE-WITH-API-HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE-WITH-API-HOST/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Headroom over MAX_UPLOAD_MB so the API returns 413 FILE_TOO_LARGE in the
    # canonical error shape rather than Nginx serving its own error page.
    client_max_body_size 12m;

    access_log /var/log/nginx/physez-api.access.log;
    error_log  /var/log/nginx/physez-api.error.log;

    # Only /api/* is public. The upload directory is never served from here —
    # files go through GET /api/files/:fileId after an ownership check.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The API sets "trust proxy" and reads the client IP from these for
        # per-IP rate limiting.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
